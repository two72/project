<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>왜가리 스테이플러 (Heron Stapler) 3D Showcase</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="stapler_model.js"></script>
    <script>
      // 스테이플러 로드 및 머티리얼 최적화
      AFRAME.registerComponent("stapler-setup", {
        init: function () {
          var el = this.el;

          if (window.STAPLER_MODEL_DATA) {
            el.setAttribute("gltf-model", window.STAPLER_MODEL_DATA);
          } else {
            el.setAttribute("gltf-model", "stapler.glb");
          }

          el.addEventListener("model-loaded", function () {
            console.log("✅ 왜가리 스테이플러 3D 모델 로드 완료!");
            var mesh = el.getObject3D("mesh");
            if (mesh) {
              mesh.traverse(function (node) {
                if (node.isMesh && node.material) {
                  // 모던 문구 제품 특유의 깔끔한 질감 표현
                  node.material.metalness = 0.2;
                  node.material.roughness = 0.4;
                  node.material.needsUpdate = true;
                }
              });
            }
          });

          el.addEventListener("model-error", function (e) {
            console.error("❌ 모델 로드 에러:", e.detail);
          });
        },
      });
    </script>

    <style>
      @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #e8a044;
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
      }

      /* 모던 데스크 디자인 쇼룸 UI */
      .ui-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 28px 32px;
        box-sizing: border-box;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #431f04;
        margin-bottom: 10px;
      }

      .title-box h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        color: #2e1402;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .title-box p {
        margin: 6px 0 0 0;
        font-size: 14px;
        color: #5c2d09;
        font-weight: 500;
      }

      .guide-badge {
        align-self: flex-end;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        background: rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        color: #3b1903;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <!-- 제품 쇼룸 UI -->
    <div class="ui-container">
      <div class="title-box">
        <div class="brand-badge">Office &middot; Design Stationery</div>
        <h1>왜가리 스테이플러</h1>
        <p>Heron Stapler &mdash; Modern Desk Collection</p>
      </div>
      <div class="guide-badge">
        <span>🖱️ 마우스로 360&deg; 둘러보기</span>
      </div>
    </div>

    <!-- 3D 씬 (주황빛 도는 노란색 스튜디오 배경) -->
    <a-scene background="color: #e8a044">
      <!-- 스튜디오 제품 조명 (3-Point Lighting) -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.95"></a-entity>
      <a-entity
        light="type: directional; color: #fffaf0; intensity: 1.4"
        position="3 6 4"
      ></a-entity>
      <a-entity
        light="type: directional; color: #ffecd2; intensity: 0.7"
        position="-3 3 -2"
      ></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.0; distance: 8"
        position="0 3.2 -3"
      ></a-entity>

      <!-- 카메라 릭 -->
      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0" look-controls wasd-controls></a-camera>
      </a-entity>

      <!-- 모던 미니멀 전시대 (Studio Podium) -->
      <!-- 바닥 소프트 섀도우 -->
      <a-circle
        position="0 0.14 -3"
        rotation="-90 0 0"
        radius="1.6"
        color="#874e14"
        material="shader: flat; opacity: 0.35; transparent: true;"
      ></a-circle>

      <!-- 매트 아이보리 화이트 원형 포디움 -->
      <a-cylinder
        position="0 0.25 -3"
        radius="1.35"
        height="0.22"
        color="#faf7ee"
        material="roughness: 0.6; metalness: 0.05;"
      ></a-cylinder>

      <!-- 포디움 상단 베벨 링 장식 -->
      <a-ring
        position="0 0.361 -3"
        rotation="-90 0 0"
        radius-inner="1.2"
        radius-outer="1.34"
        color="#f0ebe0"
        material="roughness: 0.5;"
      ></a-ring>

      <!-- 포디움 위에서 깔끔하게 제자리 회전하는 왜가리 스테이플러 -->
      <a-entity
        stapler-setup
        position="0 1.3 -3"
        scale="5 5 5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 9500; easing: linear;"
      ></a-entity>
    </a-scene>
  </body>
</html>
